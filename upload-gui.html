<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Garden — CMS</title>
    <style>
        :root {
            --bg: #f7f7f5;
            --surface: #fff;
            --text: #222;
            --text-muted: #666;
            --border: rgba(0, 0, 0, 0.08);
            --shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.06), 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 0 0 1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.08), 0 4px 8px rgba(0, 0, 0, 0.06);
            --brand: #1a4632;
            --brand-hover: #143528;
            --danger: #b42318;
            --danger-bg: #fef3f2;
            --success: #067647;
            --success-bg: #ecfdf3;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }

        .app {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 3rem;
        }

        .header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 500;
            text-wrap: balance;
        }

        .header-links {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
        }

        .header-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 150ms ease-out;
        }

        .header-links a:hover { color: var(--brand); }

        .tabs {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 1.5rem;
            background: rgba(0, 0, 0, 0.04);
            padding: 0.25rem;
            border-radius: var(--radius-md);
            width: fit-content;
        }

        .tab-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition-property: color, background, box-shadow;
            transition-duration: 150ms;
            transition-timing-function: ease-out;
            min-height: 2.5rem;
        }

        .tab-btn:hover { color: var(--text); }

        .tab-btn.active {
            background: var(--surface);
            color: var(--text);
            box-shadow: var(--shadow);
        }

        .tab-btn:active { transform: scale(0.96); }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .upload-layout {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 1.5rem;
            align-items: start;
        }

        .panel {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 1.25rem;
        }

        .panel-title {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .dropzone {
            border: 1.5px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition-property: border-color, background, box-shadow;
            transition-duration: 150ms;
            transition-timing-function: ease-out;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .dropzone:hover,
        .dropzone.dragover {
            border-color: var(--brand);
            background: rgba(26, 70, 50, 0.03);
        }

        .dropzone.has-file {
            border-style: solid;
            border-color: var(--brand);
            padding: 0.75rem;
        }

        .dropzone-label {
            font-size: 0.9375rem;
            color: var(--text);
        }

        .dropzone-hint {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .dropzone-hint strong {
            color: var(--brand);
            font-weight: 500;
        }

        .preview-wrap {
            position: relative;
            width: 100%;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg);
        }

        .preview-wrap img {
            display: block;
            width: 100%;
            max-height: 280px;
            object-fit: contain;
        }

        .preview-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.5rem;
            margin-top: 0.75rem;
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .preview-meta span { font-variant-numeric: tabular-nums; }

        .btn-ghost {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 0.8125rem;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            transition: background 150ms ease-out;
            min-height: 2.5rem;
        }

        .btn-ghost:hover { background: var(--danger-bg); }
        .btn-ghost:active { transform: scale(0.96); }

        .field { margin-bottom: 1.125rem; }

        .field label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            margin-bottom: 0.375rem;
            color: var(--text);
        }

        .field-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 0.625rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            font-size: 0.9375rem;
            transition-property: border-color, box-shadow;
            transition-duration: 150ms;
            transition-timing-function: ease-out;
        }

        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(26, 70, 50, 0.12);
        }

        .field input.invalid { border-color: var(--danger); }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .tag-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
            margin-top: 0.5rem;
        }

        .tag-chip {
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
            cursor: pointer;
            transition-property: border-color, color, background;
            transition-duration: 150ms;
            transition-timing-function: ease-out;
        }

        .tag-chip:hover {
            border-color: var(--brand);
            color: var(--brand);
            background: rgba(26, 70, 50, 0.05);
        }

        .tag-chip:active { transform: scale(0.96); }

        .ratio-picker {
            display: flex;
            gap: 0.5rem;
        }

        .ratio-option {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            transition-property: border-color, color, background;
            transition-duration: 150ms;
            transition-timing-function: ease-out;
            background: var(--surface);
        }

        .ratio-option:hover { border-color: var(--brand); }

        .ratio-option.selected {
            border-color: var(--brand);
            color: var(--brand);
            background: rgba(26, 70, 50, 0.05);
        }

        .ratio-icon {
            display: block;
            margin: 0 auto 0.25rem;
            border: 1.5px solid currentColor;
            border-radius: 2px;
        }

        .ratio-icon.auto { width: 20px; height: 16px; }
        .ratio-icon.square { width: 16px; height: 16px; }
        .ratio-icon.landscape { width: 20px; height: 14px; }
        .ratio-icon.portrait { width: 14px; height: 20px; }

        .actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn {
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9375rem;
            font-weight: 500;
            padding: 0.625rem 1.25rem;
            cursor: pointer;
            transition-property: background, box-shadow, transform;
            transition-duration: 150ms;
            transition-timing-function: ease-out;
            min-height: 2.5rem;
        }

        .btn:active:not(:disabled) { transform: scale(0.96); }

        .btn-primary {
            background: var(--brand);
            color: #fff;
            box-shadow: var(--shadow);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--brand-hover);
            box-shadow: var(--shadow-hover);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            box-shadow: var(--shadow);
        }

        .btn-secondary:hover { box-shadow: var(--shadow-hover); }

        .progress-panel {
            display: none;
            margin-top: 1.25rem;
            padding: 1rem;
            background: var(--surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
        }

        .progress-panel.visible { display: block; }

        .progress-steps {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            font-size: 0.75rem;
        }

        .progress-step {
            flex: 1;
            padding: 0.375rem 0.5rem;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            text-align: center;
            transition: background 150ms ease-out, color 150ms ease-out;
        }

        .progress-step.active {
            background: rgba(26, 70, 50, 0.08);
            color: var(--brand);
        }

        .progress-step.done {
            background: var(--success-bg);
            color: var(--success);
        }

        .progress-bar-track {
            height: 4px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--brand);
            border-radius: 2px;
            transition: width 300ms ease-out;
            width: 0%;
        }

        .progress-label {
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .manage-toolbar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(26, 70, 50, 0.12);
        }

        .post-count {
            font-size: 0.8125rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .posts-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .post-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: box-shadow 150ms ease-out;
        }

        .post-card:hover { box-shadow: var(--shadow-hover); }

        .post-card-inner {
            display: grid;
            grid-template-columns: 72px 1fr auto;
            gap: 1rem;
            padding: 1rem;
            align-items: start;
        }

        .post-thumb {
            width: 72px;
            height: 72px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            background: var(--bg);
        }

        .post-thumb-placeholder {
            width: 72px;
            height: 72px;
            border-radius: var(--radius-sm);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.625rem;
            color: var(--text-muted);
            text-align: center;
        }

        .post-info h3 {
            font-size: 0.9375rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
            text-wrap: balance;
        }

        .post-meta-line {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .post-tags-inline {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-top: 0.5rem;
        }

        .post-tag {
            font-size: 0.6875rem;
            padding: 0.125rem 0.375rem;
            border-radius: 999px;
            background: rgba(26, 70, 50, 0.08);
            color: var(--brand);
        }

        .post-actions {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }

        .btn-sm {
            font-size: 0.75rem;
            padding: 0.375rem 0.625rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition-property: border-color, background, transform;
            transition-duration: 150ms;
            transition-timing-function: ease-out;
            min-height: 2.5rem;
            white-space: nowrap;
        }

        .btn-sm:hover { border-color: var(--brand); color: var(--brand); }
        .btn-sm:active { transform: scale(0.96); }

        .btn-sm.danger:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: var(--danger-bg);
        }

        .edit-panel {
            display: none;
            padding: 1rem;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }

        .edit-panel.open { display: block; }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--text-muted);
            font-size: 0.9375rem;
        }

        .empty-state p { margin-top: 0.5rem; font-size: 0.8125rem; }

        .loading-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: 360px;
        }

        .toast {
            padding: 0.875rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            box-shadow: var(--shadow-hover);
            animation: toast-in 200ms ease-out;
        }

        .toast.success { background: var(--success-bg); color: var(--success); }
        .toast.error { background: var(--danger-bg); color: var(--danger); }

        .toast a { color: inherit; font-weight: 500; }

        @keyframes toast-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden { display: none !important; }

        @media (max-width: 720px) {
            .upload-layout { grid-template-columns: 1fr; }
            .field-row { grid-template-columns: 1fr; }
            .post-card-inner { grid-template-columns: 56px 1fr; }
            .post-actions {
                grid-column: 1 / -1;
                flex-direction: row;
            }
            .actions { flex-direction: column; }
            .actions .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Visual Garden</h1>
            <nav class="header-links">
                <a href="https://garden.tomasjgonzalez.com/" target="_blank" rel="noopener">Live site</a>
                <a href="http://localhost:1313/" target="_blank" rel="noopener">Local preview</a>
            </nav>
        </header>

        <div class="tabs" role="tablist">
            <button class="tab-btn active" role="tab" aria-selected="true" data-tab="upload">New post</button>
            <button class="tab-btn" role="tab" aria-selected="false" data-tab="manage">Manage <span id="postCountBadge"></span></button>
        </div>

        <div id="uploadPanel" class="tab-panel active" role="tabpanel">
            <form id="uploadForm">
                <div class="upload-layout">
                    <div class="panel">
                        <p class="panel-title">Image</p>
                        <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload image">
                            <div id="dropzoneEmpty">
                                <p class="dropzone-label">Drop an image here</p>
                                <p class="dropzone-hint">or <strong>browse</strong> · JPG, PNG, WebP · max 50 MB</p>
                            </div>
                            <div id="dropzonePreview" class="hidden">
                                <div class="preview-wrap">
                                    <img id="previewImg" alt="Preview">
                                </div>
                                <div class="preview-meta">
                                    <span id="previewName"></span>
                                    <button type="button" class="btn-ghost" id="removeFile">Remove</button>
                                </div>
                            </div>
                        </div>
                        <input type="file" id="imageInput" accept="image/*" class="hidden">
                    </div>

                    <div class="panel">
                        <p class="panel-title">Details</p>

                        <div class="field">
                            <label for="title">Title</label>
                            <input type="text" id="title" required placeholder="Post title" autocomplete="off">
                        </div>

                        <div class="field">
                            <label for="imageAlt">Alt text</label>
                            <input type="text" id="imageAlt" required placeholder="Describe the image" autocomplete="off">
                            <p class="field-hint">Used for accessibility and SEO</p>
                        </div>

                        <div class="field">
                            <label for="tags">Tags</label>
                            <input type="text" id="tags" placeholder="inspiration, design, game">
                            <div class="tag-suggestions" id="tagSuggestions"></div>
                        </div>

                        <div class="field">
                            <label>Image ratio</label>
                            <input type="hidden" id="imageRatio" value="">
                            <div class="ratio-picker" id="ratioPicker">
                                <button type="button" class="ratio-option selected" data-ratio="">
                                    <span class="ratio-icon auto"></span>Auto
                                </button>
                                <button type="button" class="ratio-option" data-ratio="square">
                                    <span class="ratio-icon square"></span>Square
                                </button>
                                <button type="button" class="ratio-option" data-ratio="landscape">
                                    <span class="ratio-icon landscape"></span>Landscape
                                </button>
                                <button type="button" class="ratio-option" data-ratio="portrait">
                                    <span class="ratio-icon portrait"></span>Portrait
                                </button>
                            </div>
                        </div>

                        <div class="field">
                            <label for="videoUrl">Video URL <span style="font-weight:400;color:var(--text-muted)">(optional)</span></label>
                            <input type="url" id="videoUrl" placeholder="https://youtube.com/watch?v=…">
                        </div>

                        <div class="actions">
                            <button type="submit" class="btn btn-primary" id="uploadBtn" disabled>Publish post</button>
                            <button type="button" class="btn btn-secondary" id="clearBtn">Clear</button>
                        </div>
                    </div>
                </div>
            </form>

            <div class="progress-panel" id="progress">
                <div class="progress-steps">
                    <div class="progress-step" data-step="1">Prepare</div>
                    <div class="progress-step" data-step="2">Upload</div>
                    <div class="progress-step" data-step="3">Create</div>
                    <div class="progress-step" data-step="4">Done</div>
                </div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <p class="progress-label" id="progressLabel">Starting…</p>
            </div>
        </div>

        <div id="managePanel" class="tab-panel" role="tabpanel">
            <div class="manage-toolbar">
                <input type="search" class="search-input" id="searchPosts" placeholder="Search posts…" aria-label="Search posts">
                <span class="post-count" id="postCount"></span>
            </div>
            <div class="posts-grid" id="postsList">
                <div class="loading-state">Loading posts…</div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script>
        const CLOUDINARY_BASE = 'https://res.cloudinary.com/tomasgo/image/upload/f_auto/q_60/w_144/';
        const SUGGESTED_TAGS = ['inspiration', 'design', 'game', 'music', 'people', 'nostalgia', 'book', 'art'];
        const dropzone = document.getElementById('dropzone');
        const imageInput = document.getElementById('imageInput');
        const uploadForm = document.getElementById('uploadForm');
        const uploadBtn = document.getElementById('uploadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressLabel = document.getElementById('progressLabel');
        const postsList = document.getElementById('postsList');
        const searchPosts = document.getElementById('searchPosts');

        let selectedFile = null;
        let allPosts = [];

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function toast(message, type = 'success', duration = 5000) {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = message;
            container.appendChild(el);
            setTimeout(() => el.remove(), duration);
        }

        function initTagSuggestions() {
            const container = document.getElementById('tagSuggestions');
            const tagsInput = document.getElementById('tags');
            container.innerHTML = SUGGESTED_TAGS.map(tag =>
                `<button type="button" class="tag-chip" data-tag="${tag}">${tag}</button>`
            ).join('');
            container.addEventListener('click', (e) => {
                const chip = e.target.closest('.tag-chip');
                if (!chip) return;
                const tag = chip.dataset.tag;
                const current = tagsInput.value.split(',').map(t => t.trim()).filter(Boolean);
                if (!current.includes(tag)) {
                    current.push(tag);
                    tagsInput.value = current.join(', ');
                }
            });
        }

        function initRatioPicker() {
            const picker = document.getElementById('ratioPicker');
            const hidden = document.getElementById('imageRatio');
            picker.addEventListener('click', (e) => {
                const btn = e.target.closest('.ratio-option');
                if (!btn) return;
                picker.querySelectorAll('.ratio-option').forEach(o => o.classList.remove('selected'));
                btn.classList.add('selected');
                hidden.value = btn.dataset.ratio;
            });
        }

        function setFile(file) {
            if (!file?.type.startsWith('image/')) {
                toast('Please select an image file.', 'error');
                return;
            }
            if (file.size > 50 * 1024 * 1024) {
                toast('Image must be under 50 MB.', 'error');
                return;
            }

            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('previewName').textContent =
                    `${file.name} · ${(file.size / 1024 / 1024).toFixed(1)} MB`;
                document.getElementById('dropzoneEmpty').classList.add('hidden');
                document.getElementById('dropzonePreview').classList.remove('hidden');
                dropzone.classList.add('has-file');
            };
            reader.readAsDataURL(file);

            const name = file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ');
            if (!document.getElementById('title').value) document.getElementById('title').value = name;
            if (!document.getElementById('imageAlt').value) document.getElementById('imageAlt').value = name;
            validateForm();
        }

        function clearFile() {
            selectedFile = null;
            imageInput.value = '';
            document.getElementById('dropzoneEmpty').classList.remove('hidden');
            document.getElementById('dropzonePreview').classList.add('hidden');
            dropzone.classList.remove('has-file');
            validateForm();
        }

        function validateForm() {
            const title = document.getElementById('title').value.trim();
            const alt = document.getElementById('imageAlt').value.trim();
            uploadBtn.disabled = !(selectedFile && title && alt);
        }

        dropzone.addEventListener('click', () => imageInput.click());
        dropzone.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); imageInput.click(); }
        });
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) setFile(file);
        });
        imageInput.addEventListener('change', (e) => {
            if (e.target.files[0]) setFile(e.target.files[0]);
        });
        document.getElementById('removeFile').addEventListener('click', (e) => {
            e.stopPropagation();
            clearFile();
        });
        document.getElementById('title').addEventListener('input', validateForm);
        document.getElementById('imageAlt').addEventListener('input', validateForm);

        clearBtn.addEventListener('click', () => {
            clearFile();
            uploadForm.reset();
            document.getElementById('imageRatio').value = '';
            document.querySelectorAll('.ratio-option').forEach((o, i) => {
                o.classList.toggle('selected', i === 0);
            });
            validateForm();
        });

        function showProgress() {
            progress.classList.add('visible');
            progressFill.style.width = '0%';
            document.querySelectorAll('.progress-step').forEach(s => {
                s.classList.remove('active', 'done');
            });
        }

        function updateProgress(step, label) {
            progressLabel.textContent = label;
            progressFill.style.width = `${(step / 4) * 100}%`;
            document.querySelectorAll('.progress-step').forEach(s => {
                const n = parseInt(s.dataset.step, 10);
                s.classList.toggle('done', n < step);
                s.classList.toggle('active', n === step);
            });
        }

        function hideProgress() {
            progress.classList.remove('visible');
        }

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('image', selectedFile);
            formData.append('title', document.getElementById('title').value.trim());
            formData.append('imageAlt', document.getElementById('imageAlt').value.trim());
            formData.append('tags', document.getElementById('tags').value);
            formData.append('imageRatio', document.getElementById('imageRatio').value);
            formData.append('videoUrl', document.getElementById('videoUrl').value);

            try {
                showProgress();
                uploadBtn.disabled = true;
                updateProgress(1, 'Preparing file…');
                await new Promise(r => setTimeout(r, 300));
                updateProgress(2, 'Uploading to Cloudinary…');

                const response = await fetch('/api/upload-post', { method: 'POST', body: formData });
                const result = await response.json();

                if (response.ok) {
                    updateProgress(3, 'Creating post…');
                    await new Promise(r => setTimeout(r, 200));
                    updateProgress(4, 'Done');
                    toast(`Post published. <a href="https://garden.tomasjgonzalez.com/${result.slug}/" target="_blank" rel="noopener">View live →</a>`);
                    clearBtn.click();
                    loadPosts();
                } else {
                    toast(escapeHtml(result.error || 'Upload failed'), 'error', 8000);
                }
            } catch (err) {
                toast(escapeHtml(err.message), 'error', 8000);
            } finally {
                hideProgress();
                validateForm();
            }
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.toggle('active', b === btn);
                    b.setAttribute('aria-selected', b === btn);
                });
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                document.getElementById(tab + 'Panel').classList.add('active');
                if (tab === 'manage') loadPosts();
            });
        });

        function thumbUrl(image) {
            if (!image) return null;
            return CLOUDINARY_BASE + image;
        }

        function renderPosts(posts) {
            const query = searchPosts.value.trim().toLowerCase();
            const filtered = query
                ? posts.filter(p =>
                    p.title.toLowerCase().includes(query) ||
                    p.slug.toLowerCase().includes(query) ||
                    p.tags.some(t => t.toLowerCase().includes(query))
                )
                : posts;

            document.getElementById('postCount').textContent =
                filtered.length === posts.length
                    ? `${posts.length} posts`
                    : `${filtered.length} of ${posts.length}`;

            if (filtered.length === 0) {
                postsList.innerHTML = `<div class="empty-state">
                    <strong>${query ? 'No matches' : 'No posts yet'}</strong>
                    <p>${query ? 'Try a different search term.' : 'Upload your first image to get started.'}</p>
                </div>`;
                return;
            }

            postsList.innerHTML = filtered.map(post => {
                const thumb = thumbUrl(post.image);
                const date = post.date ? new Date(post.date).toLocaleDateString('en-NZ') : '—';
                const tags = post.tags.map(t => `<span class="post-tag">${escapeHtml(t)}</span>`).join('');
                return `
                <article class="post-card" id="post-${escapeHtml(post.slug)}">
                    <div class="post-card-inner">
                        ${thumb
                            ? `<img class="post-thumb" src="${thumb}" alt="" loading="lazy">`
                            : `<div class="post-thumb-placeholder">No image</div>`}
                        <div class="post-info">
                            <h3>${escapeHtml(post.title)}</h3>
                            <p class="post-meta-line">${date} · ${escapeHtml(post.slug)}</p>
                            ${tags ? `<div class="post-tags-inline">${tags}</div>` : ''}
                        </div>
                        <div class="post-actions">
                            <button type="button" class="btn-sm" data-action="edit" data-slug="${escapeHtml(post.slug)}">Edit</button>
                            <button type="button" class="btn-sm danger" data-action="delete" data-slug="${escapeHtml(post.slug)}" data-title="${escapeHtml(post.title)}">Delete</button>
                        </div>
                    </div>
                    <div class="edit-panel" id="edit-${escapeHtml(post.slug)}">
                        <form data-slug="${escapeHtml(post.slug)}">
                            <div class="field-row">
                                <div class="field">
                                    <label>Title</label>
                                    <input type="text" name="title" value="${escapeHtml(post.title)}" required>
                                </div>
                                <div class="field">
                                    <label>Alt text</label>
                                    <input type="text" name="imageAlt" value="${escapeHtml(post.image_alt || '')}" required>
                                </div>
                            </div>
                            <div class="field-row">
                                <div class="field">
                                    <label>Tags</label>
                                    <input type="text" name="tags" value="${escapeHtml(post.tags.join(', '))}">
                                </div>
                                <div class="field">
                                    <label>Image ratio</label>
                                    <select name="imageRatio">
                                        <option value="" ${!post.image_ratio ? 'selected' : ''}>Auto</option>
                                        <option value="square" ${post.image_ratio === 'square' ? 'selected' : ''}>Square</option>
                                        <option value="landscape" ${post.image_ratio === 'landscape' ? 'selected' : ''}>Landscape</option>
                                        <option value="portrait" ${post.image_ratio === 'portrait' ? 'selected' : ''}>Portrait</option>
                                    </select>
                                </div>
                            </div>
                            <div class="field">
                                <label>Video URL</label>
                                <input type="url" name="videoUrl" value="${escapeHtml(post.video_url || '')}">
                            </div>
                            <div class="actions" style="margin-top:1rem">
                                <button type="submit" class="btn btn-primary">Save</button>
                                <button type="button" class="btn btn-secondary" data-action="cancel" data-slug="${escapeHtml(post.slug)}">Cancel</button>
                            </div>
                        </form>
                    </div>
                </article>`;
            }).join('');
        }

        async function loadPosts() {
            postsList.innerHTML = '<div class="loading-state">Loading posts…</div>';
            try {
                const res = await fetch('/api/posts');
                const data = await res.json();
                allPosts = data.posts || [];
                document.getElementById('postCountBadge').textContent =
                    allPosts.length ? `(${allPosts.length})` : '';
                renderPosts(allPosts);
            } catch (err) {
                postsList.innerHTML = `<div class="empty-state"><strong>Could not load posts</strong><p>${escapeHtml(err.message)}</p></div>`;
            }
        }

        searchPosts.addEventListener('input', () => renderPosts(allPosts));

        postsList.addEventListener('click', async (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const { action, slug, title } = btn.dataset;

            if (action === 'edit') {
                document.querySelectorAll('.edit-panel').forEach(p => p.classList.remove('open'));
                document.getElementById(`edit-${slug}`)?.classList.add('open');
            } else if (action === 'cancel') {
                document.getElementById(`edit-${slug}`)?.classList.remove('open');
            } else if (action === 'delete') {
                if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
                try {
                    const res = await fetch(`/api/posts/${slug}`, { method: 'DELETE' });
                    if (res.ok) {
                        toast('Post deleted.');
                        loadPosts();
                    } else {
                        const err = await res.json();
                        toast(escapeHtml(err.error || 'Delete failed'), 'error');
                    }
                } catch (err) {
                    toast(escapeHtml(err.message), 'error');
                }
            }
        });

        postsList.addEventListener('submit', async (e) => {
            const form = e.target.closest('form[data-slug]');
            if (!form) return;
            e.preventDefault();
            const slug = form.dataset.slug;
            const fd = new FormData(form);
            try {
                const res = await fetch(`/api/posts/${slug}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: fd.get('title'),
                        imageAlt: fd.get('imageAlt'),
                        tags: fd.get('tags'),
                        imageRatio: fd.get('imageRatio'),
                        videoUrl: fd.get('videoUrl')
                    })
                });
                if (res.ok) {
                    toast('Post updated.');
                    document.getElementById(`edit-${slug}`)?.classList.remove('open');
                    loadPosts();
                } else {
                    const err = await res.json();
                    toast(escapeHtml(err.error || 'Update failed'), 'error');
                }
            } catch (err) {
                toast(escapeHtml(err.message), 'error');
            }
        });

        initTagSuggestions();
        initRatioPicker();
        validateForm();
        loadPosts();
    </script>
</body>
</html>
